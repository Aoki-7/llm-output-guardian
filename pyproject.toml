[project]
name = "llm-output-guardian"
version = "0.1.0"
description = "把不稳定、不规范、不可直接消费的大模型输出，转换为稳定、可验证、可追踪的结构化结果"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "jsonschema>=4.21",
    "rapidfuzz>=3.6",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "hypothesis>=6.100",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
